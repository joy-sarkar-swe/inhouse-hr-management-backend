name: nest_auth_template

services:

  # ───────────────────────────────────────────────────────────────────────────
  # PostgreSQL Database
  # ───────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: app_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app_db}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ───────────────────────────────────────────────────────────────────────────
  # Redis — sessions, throttle counters, email queues, L2 cache, Bloom filter
  # ───────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: app_redis
    restart: unless-stopped
    command: >
      redis-server
      --databases 32
      --save 60 1000
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy noeviction
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 384M

  # ───────────────────────────────────────────────────────────────────────────
  # NestJS API (Production / CI-CD)
  #
  # Runs both the HTTP server and the BullMQ email workers in a single
  # process (EmailModule's queue workers start wherever EmailModule is
  # imported — see src/app.module.ts). There is no separate worker process
  # in this template.
  # ───────────────────────────────────────────────────────────────────────────
  api:
    image: your-registry/nest-auth-template:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app_api
    restart: unless-stopped
    ports:
      - '8080:8080'
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-app_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-net
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

networks:
  app-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
