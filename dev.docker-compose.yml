name: nest_auth_template_dev

services:

  # ───────────────────────────────────────────────────────────────────────────
  # PostgreSQL Database
  # ───────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: app_postgres_dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hr_management_db}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '5439:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hr_management_db}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net

  # ───────────────────────────────────────────────────────────────────────────
  # Redis — sessions, throttle counters, email queues, L2 cache, Bloom filter
  # ───────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: app_redis_dev
    restart: unless-stopped
    command: >
      redis-server
      --databases 32
      --save 60 1000
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy noeviction
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net

  # ───────────────────────────────────────────────────────────────────────────
  # NestJS API (Local Development — hot-reload)
  #
  # Runs both the HTTP server and the BullMQ email workers in a single
  # process — there is no separate worker service in this template.
  # ───────────────────────────────────────────────────────────────────────────
  api:
    image: your-registry/nest-auth-template:${IMAGE_TAG:-dev-latest}
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: app_api_dev
    restart: unless-stopped
    ports:
      - '8080:8080'
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-hr_management_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npm run start:dev"
    networks:
      - app-net
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

networks:
  app-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
